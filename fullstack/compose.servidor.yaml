# ApuntIA en una laptop + Cloudflare Tunnel instalado en el HOST.
# El puerto queda vinculado EXCLUSIVAMENTE a 127.0.0.1 del equipo.
# La app sirve la interfaz y la API en el mismo FastAPI (sin Nginx público).
#
# Desde la raíz del repositorio:
# docker compose --env-file fullstack/config/.env -f fullstack/compose.servidor.yaml up --build -d
# URL de la app pública: https://TU_DOMINIO/inicio (y / redirige a /inicio).
name: apuntia-servidor

services:
  backend:
    build:
      context: ..
      dockerfile: fullstack/docker/backend.Dockerfile
    image: apuntia-backend:servidor
    env_file:
      - path: config/.env
        required: true
    environment:
      DATA_DIR: /datos
      FRONT_DIR: /app/front
      PAGINA_INICIO: /app/index.html
      # HTTPS termina en Cloudflare, pero la cookie del navegador SIEMPRE debe ser Secure.
      COOKIE_SEGURA: "1"
      APUNTIA_REDIRECCION_INICIO: "1"
      # Configura y vincula Ollama exclusivamente en la consola del servidor.
      APUNTIA_IA_SOLO_CLI: "1"
      MPLCONFIGDIR: /tmp/matplotlib
    # Sin puertos públicos, sin acceso directo desde la LAN ni el router.
    ports:
      - "127.0.0.1:${APUNTIA_PUERTO:-8000}:8000"
    volumes:
      - datos:/datos
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    stop_grace_period: 20s
    # No confiar en X-Forwarded-For de clientes remotos; se usa URL_PUBLICA para CSRF.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers", "--timeout-graceful-shutdown", "15"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=4))['estado']=='ok' else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  datos:
