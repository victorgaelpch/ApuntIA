# Nginx de ApuntIA (FULL-13). Interfaz estática + proxy de la API en el mismo origen.
# Las cabeceras de seguridad de las páginas son las mismas que pone el backend en el
# modo sin Docker (app/core/endurecimiento.py, CSP_INTERFAZ).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/apuntia;

    # Fotos: hasta MAX_UPLOAD_MB × MAX_PAGINAS; el backend aplica el límite exacto.
    client_max_body_size 220m;
    client_body_timeout 120s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    set $csp "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # ----- interfaz estática
    location = /inicio {
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Opener-Policy same-origin always;
    }
    location = /front { return 302 /front/apuntes.html; }
    location = /front/ { return 302 /front/apuntes.html; }
    location /front/ {
        # Solo recursos de la interfaz.
        location ~* ^/front/(tests|node_modules)/ { return 404; }
        location ~* \.(html|css|js|png|jpe?g|svg|webp|ico)$ {
            add_header Cache-Control "no-cache" always;
            add_header Content-Security-Policy $csp always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Cross-Origin-Opener-Policy same-origin always;
        }
        return 404;
    }

    # ----- API y resto (incluido GET / de la v1) al backend
    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Se SOBRESCRIBE con la IP real (no se añade a lo que mande el cliente): el backend la usa
        # para los límites de intentos por IP y no debe poder falsificarse (FULL-20).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
        proxy_request_buffering off;
    }
}
